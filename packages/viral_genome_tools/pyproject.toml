[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viral-genome-tools"
version = "0.1.0"
description = "Circular viral concatemer monomerization, ICTV landmark rotation, and physical circular junction scoring"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    { name = "Molecular Plant Pathology Lab, ICAR-Indian Sugarcane Research Institute", email = "shwetabac@gmail.com" },
]
maintainers = [
    { name = "Dr. Shweta Singh", email = "shwetabac@gmail.com" },
]
keywords = ["virome", "circular-genome", "badnavirus", "geminivirus", "bioinformatics"]
dependencies = [
    "biopython>=1.81",
    "numpy>=1.24.0",
]

[project.urls]
Homepage = "https://github.com/molecularplantpathology/Virome-Suite"
Repository = "https://github.com/molecularplantpathology/Virome-Suite.git"
Issues = "https://github.com/molecularplantpathology/Virome-Suite/issues"

[project.scripts]
viral-genome-tools = "viral_genome_tools.cli:main"

[tool.setuptools]
packages = ["viral_genome_tools"]
